---
version: '3'

# Talos configuration is managed with topf (https://github.com/postfinance/topf).
# topf reads talos/topf.yaml + the patches under talos/{all,control-plane,node},
# auto-decrypts talos/secrets.sops.yaml and SOPS-encrypted patches, and talks to
# nodes using the secrets bundle (no talosconfig needed for apply/upgrade).

tasks:

  render:
    desc: Render Talos machine configs to talos/rendered (no apply)
    dir: '{{.TALOS_DIR}}'
    cmd: topf render --output ./rendered
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  diff:
    desc: Show pending Talos config changes without applying them
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --dry-run
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply:
    desc: Apply Talos config to all nodes (shows a diff and asks first)
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply-node:
    desc: Apply Talos config to a single node [NODE=hostname] [MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --nodes-filter "^{{.NODE}}$" --mode "{{.MODE}}"
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  nodes:
    desc: List all nodes and their current state
    dir: '{{.TALOS_DIR}}'
    cmd: topf nodes
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  talosconfig:
    desc: Generate and save talosconfig from the secrets bundle
    dir: '{{.TALOS_DIR}}'
    cmd: topf talosconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  upgrade:
    desc: Upgrade Talos on all nodes, one at a time (asks first)
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=hostname]
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade --nodes-filter "^{{.NODE}}$"
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  upgrade-k8s:
    desc: Upgrade Kubernetes to the version pinned in topf.yaml
    dir: '{{.TALOS_DIR}}'
    cmd: >-
      talosctl --nodes "$(yq '[.nodes[] | select(.role == "control-plane")][0].ip' topf.yaml)"
      upgrade-k8s --to "$(yq '.kubernetesVersion' topf.yaml)"
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  reset:
    desc: Reset all nodes back to maintenance mode (DESTRUCTIVE)
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset all nodes back to maintenance mode... continue?
    cmd: topf reset --confirm=false
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  reset-node:
    desc: Reset a single node back to maintenance mode [NODE=hostname] (DESTRUCTIVE)
    dir: '{{.TALOS_DIR}}'
    prompt: This will reset node {{.NODE}} back to maintenance mode... continue?
    cmd: topf reset --nodes-filter "^{{.NODE}}$" --confirm=false
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf
