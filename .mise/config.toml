min_version = "2026.7.0"

[env]
# Point npm's user config at a repo-local file so mise's npm backend (oxfmt,
# node) resolves from the public registry regardless of a machine's global
# ~/.npmrc (e.g. a corporate registry that lacks these public packages).
# Applied whenever mise is activated / running (shells, shims, tasks, hooks).
NPM_CONFIG_USERCONFIG = "{{config_root}}/.mise/npmrc"
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
"aqua:max-sixty/worktrunk" = "0.82.0"
"aqua:prometheus/alertmanager" = "0.35.0"
"github:Backblaze/B2_Command_Line_Tool" = "v5.0.3"
"github:postfinance/topf" = "v0.6.2"
actionlint = "1.7.12"
age = "1.3.2"
cilium-cli = "0.20.3"
cilium-hubble = "v1.20.4"
cloudflared = "2026.11.0"
cue = "0.17.1"
flux2 = "2.10.0"
gh = "2.104.0"
gum = "2.0.2"
helm = "4.3.2"
helmfile = "1.8.4"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
lefthook = "2.2.2"
loki-logcli = "3.7.10"
node = "26.13.1"
oxfmt = "0.78.0"
promtool = "3.16.0"
shellcheck = "0.11.0"
sops = "3.13.3"
talosctl = "1.14.6"
uv = "0.13.8"
yq = "4.54.3"
zizmor = "1.32.0"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[hooks]
postinstall = "lefthook install"
