title: Kubernetes Secret Read By OIDC User
id: e0d7f781-af63-4eff-9c6a-e1e9029acc3b
status: experimental
description: >-
  Detects get, list, or watch of Secrets by a Pocket ID (oidc:*) user. The OIDC group is bound to
  cluster-admin for Headlamp, so an IdP compromise lands here first; routine GitOps never needs a
  human to read Secret values.
references:
  - https://kubernetes.io/docs/reference/access-authn-authz/authentication/#openid-connect-tokens
author: securimancer
date: 2026-09-30
tags:
  - attack.credential-access
  - attack.t1552.007
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    user.username|startswith: "oidc:"
    objectRef.resource: secrets
    verb:
      - get
      - list
      - watch
  condition: selection
falsepositives:
  - The cluster owner browsing Secrets in Headlamp
level: medium
