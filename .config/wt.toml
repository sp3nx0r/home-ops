# Worktrunk project config: https://worktrunk.dev/config/
# Symlink (not copy) gitignored credentials so mise's {{config_root}} env paths resolve in the worktree.
[[pre-start]]
credentials = """
for f in kubeconfig age.key talos/clusterconfig/talosconfig; do
  if [ -e {{ primary_worktree_path }}/$f ] && [ ! -e $f ]; then
    mkdir -p "$(dirname $f)" && ln -s {{ primary_worktree_path }}/$f $f
  fi
done
"""

[[pre-start]]
trust = "mise trust -q ."
