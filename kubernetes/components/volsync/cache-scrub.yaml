# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.18.0-standalone-strict/all.json
# The Kopia mover caches repository index blobs as many tiny files under
# /cache/index-blobs. Kopia evicts that cache by total bytes, never by file
# count, so on a small ext4 cache PVC the file count exhausts inodes long
# before the byte cap and trips KubePersistentVolumeInodesFillingUp. Deleting
# the disposable cache PVC once per day bounds the inode count; VolSync
# recreates it (owned by the ReplicationSource) on the next scheduled sync.
#
# Only ${APP} is substituted by Flux (brace form). All shell variables use the
# bare $var form, which Flux's envsubst leaves untouched.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP}-cache-scrub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP}-cache-scrub
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    resourceNames:
      - volsync-src-${APP}
    verbs:
      - get
      # delete: reap a stale/failed mover job so its pods stop pinning the
      # cache PVC via pvc-protection (see the scrub script for the deadlock).
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    resourceNames:
      - volsync-src-${APP}-cache
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP}-cache-scrub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP}-cache-scrub
subjects:
  - kind: ServiceAccount
    name: ${APP}-cache-scrub
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${APP}-cache-scrub
spec:
  timeZone: America/Chicago
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Covers the jitter sleep (up to 900s) plus the job check and delete.
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ${APP}-cache-scrub
            app.kubernetes.io/component: cache-scrub
        spec:
          serviceAccountName: ${APP}-cache-scrub
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          initContainers:
            # Spread the fleet's scrubs across a window so ~20 cache PVC
            # deletes do not hit the CSI/API server at once, mirroring the
            # volsync-mover-jitter init container used for the movers.
            - name: jitter
              image: ghcr.io/home-operations/busybox:1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - sleep $(shuf -i 0-900 -n 1)
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: scrub
              image: bitnami/kubectl:latest@sha256:bedd34c910e2a5ce9836813d16444af449d7fe07a29136d59f34e861e8e660c5
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  mover_job="volsync-src-${APP}"
                  cache_pvc="volsync-src-${APP}-cache"

                  # Raw requests, because on a 404 `kubectl get/delete
                  # --ignore-not-found` also GETs the (cluster-scoped)
                  # Namespace, which this namespaced Role cannot grant.
                  # Prints the body; returns 1 on NotFound; exits on any other error.
                  raw() {
                    if kubectl "$1" --raw "$2" 2>/tmp/raw.err; then
                      return 0
                    fi
                    grep -q '(NotFound)' /tmp/raw.err && return 1
                    cat /tmp/raw.err >&2
                    exit 1
                  }

                  mover_active=""
                  mover_job_present=""
                  if job="$(raw get "/apis/batch/v1/namespaces/$POD_NAMESPACE/jobs/$mover_job")"; then
                    mover_job_present=1
                    mover_active="$(printf '%s' "$job" | grep -o '"active":[0-9]*' | cut -d: -f2 || true)"
                  elif [ -s /tmp/raw.err ] && ! grep -q '(NotFound)' /tmp/raw.err; then
                    exit 1
                  fi
                  if [ -n "$mover_active" ] && [ "$mover_active" != "0" ]; then
                    echo "VolSync mover $mover_job is active; skipping cache scrub"
                    exit 0
                  fi

                  # A mover job still present here is idle (active=0): failed, or a
                  # leftover VolSync has not reaped. Its Failed pods keep
                  # kubernetes.io/pvc-protection on the cache PVC, so deleting the
                  # PVC while they linger wedges it in Terminating and the next
                  # mover pod cannot bind a same-named cache PVC (FailedScheduling,
                  # indefinitely). Reap the stale job first; a background cascade
                  # takes its pods with it and VolSync recreates a fresh mover on
                  # the next sync. kubectl (not raw) for the Background DeleteOptions;
                  # NotFound is tolerated, any other error surfaces.
                  if [ -n "$mover_job_present" ]; then
                    if kubectl delete job "$mover_job" -n "$POD_NAMESPACE" \
                        --propagation-policy=Background --wait=false 2>/tmp/del.err; then
                      echo "reaped stale mover job $mover_job so its pods release $cache_pvc"
                    elif grep -q 'NotFound' /tmp/del.err; then
                      echo "stale mover job $mover_job already gone"
                    else
                      cat /tmp/del.err >&2
                      exit 1
                    fi
                  fi

                  if raw delete "/api/v1/namespaces/$POD_NAMESPACE/persistentvolumeclaims/$cache_pvc" >/dev/null; then
                    echo "deleted disposable Kopia cache PVC $cache_pvc; VolSync recreates it on the next sync"
                  else
                    echo "cache PVC $cache_pvc already absent"
                  fi
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  # kubectl (client-go discovery + delete/get) peaks well above
                  # 64Mi; a tight limit OOMKills the mover after it has already
                  # issued the delete, failing the Job. 256Mi leaves headroom.
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
---
# The scrub container runs kubectl (get job, delete the cache PVC) against
# the API server. Selecting it makes it default-deny under the cluster floor,
# so grant only DNS + the apiserver. kubectl reaches the API via the kubernetes
# ClusterIP, which DNATs to a node :6443 — the local node presents as host,
# remote control-plane nodes as kube-apiserver/remote-node.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-cache-scrub
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ${APP}-cache-scrub
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
