---
# KOPIA_PASSWORD is injected from the cluster-secrets Secret via Flux
# postBuild substitution. Every app that includes this component MUST set
# postBuild.substituteFrom to cluster-secrets in its Flux Kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-volsync-secret
type: Opaque
stringData:
  KOPIA_PASSWORD: ${KOPIA_PASSWORD}
  KOPIA_REPOSITORY: filesystem:///mnt/repository
