---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/talos.dev/serviceaccount_v1alpha1.json
# Talos mints a Secret of the same name holding a talosconfig whose client
# certificate carries only these roles. os:etcd:backup grants EtcdSnapshot and
# nothing else; the namespace could request os:admin, so never widen this.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup-talos
spec:
  roles:
    - os:etcd:backup
