---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  values:
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
  # The chart has no dnsConfig value. Under the default ndots:5, CoreDNS autopath
  # resolves ghcr.io as ghcr.io.system-upgrade.svc.cluster.local (CNAME), which the
  # toFQDNs matchName in ciliumnetworkpolicy.yaml never matches.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: tuppr
            patch: |
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
