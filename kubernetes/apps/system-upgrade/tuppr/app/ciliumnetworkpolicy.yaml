---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tuppr
spec:
  # Namespace-wide: the controller and its upgrade Jobs can all reach the Talos
  # API as os:admin, so default-deny the whole namespace.
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: system-upgrade
  ingress:
    # Prometheus scrape (metrics + health share port 8081)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # kube-apiserver -> validating admission webhook
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # kubelet probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    # DNS resolution. L7 DNS rules make lookups visible to Cilium's DNS proxy so
    # the toFQDNs egress below can be enforced (required for FQDN policy).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API server
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Talos API (apid). Node IPs carry host/remote-node identities, not CIDR.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    # Talos API on the nodes and the floating API VIP (which may lack a node identity)
    - toCIDRSet:
        - cidr: 192.168.5.50/32
        - cidr: 192.168.5.51/32
        - cidr: 192.168.5.52/32
        - cidr: 192.168.5.254/32
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    # Registries for pre-upgrade image manifest checks
    - toFQDNs:
        - matchName: ghcr.io
        - matchName: factory.talos.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
