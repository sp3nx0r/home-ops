---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
spec:
  chart:
    spec:
      chart: kubescape-operator
      version: 1.41.0
      sourceRef:
        kind: HelmRepository
        name: kubescape
  interval: 1h
  values:
    clusterName: homelab
    # Scan kube-system too: it holds the most privileged workloads.
    excludeNamespaces: kubescape,kube-public,kube-node-lease
    # Hourly Volsync movers and daily cache scrubs would each get a fresh SBOM,
    # container profile and CVE scan per run. node-agent matches values exactly.
    excludeLabels:
      app.kubernetes.io/created-by: ["volsync"]
      app.kubernetes.io/component: ["cache-scrub"]
    # Frameworks for the startup scan and exception-triggered rescans; the weekly
    # CronJob below names the same set explicitly.
    defaultFrameworks:
      - nsa
      - mitre
      - cis-v1.12.0
      - security
    # Posture + vulnerabilities + relevancy only. Runtime detection (planned:
    # Tetragon) and admission enforcement (planned: Kyverno) stay off, and CNPs
    # are hand-authored, so the node-agent is only used for SBOMs, host sensing
    # and runtime relevancy.
    capabilities:
      configurationScan: enable
      # Also gates storage of detailed WorkloadConfigurationScan objects; without
      # it only the summaries are refreshed.
      continuousScan: enable
      nodeScan: enable
      vulnerabilityScan: enable
      nodeSbomGeneration: enable
      relevancy: enable
      runtimeObservability: enable
      vexGeneration: enable
      prometheusExporter: enable
      admissionController: disable
      autoUpgrading: disable
      httpDetection: disable
      malwareDetection: disable
      manageWorkloads: disable
      networkEventsStreaming: disable
      networkPolicyService: disable
      nodeProfileService: disable
      remediation: disable
      riskAcceptance: disable
      runtimeDetection: disable
      seccompProfileService: disable
    # An empty watch set keeps continuousScan from rescanning on every resource
    # event; the weekly scheduled scan still persists detailed results.
    continuousScanning:
      matchingRules:
        match: []
        namespaces: []
    certificates:
      # Generates the storage mTLS certs at runtime and reuses the CA Secret, so
      # Flux upgrades don't rotate them.
      strategy: initContainer
      certgen:
        image:
          repository: quay.io/kubescape/kubectl
          tag: 1.36.1@sha256:e2b97dde9666986c61c56d49aae85a714b89b69392baa531438e74ec34096fb4
    global:
      # Node-agent SBOMs remove the need to read image pull secrets cluster-wide.
      enableClusterWideSecretAccess: false
    kubescape:
      image:
        repository: quay.io/kubescape/kubescape
        tag: v4.0.17@sha256:748dd53e14c569f084e2f7d0a8fdf6adf0b4ecaee1111ecd1cc2281467899ed9
      skipUpdateCheck: true
    kubescapeScheduler:
      image:
        repository: quay.io/kubescape/http-request
        tag: v0.2.23@sha256:4ff502a33423cd362b7fd70e98b0ac2121799fb7df22d7def326e528cbec5685
      # Weekly, and staggered after the vulnerability scan: both write heavily to
      # the storage component's single-writer SQLite database on HDD-backed iSCSI.
      scanSchedule: "0 5 * * 0"
      requestBody:
        commands:
          - CommandName: kubescapeScan
            args:
              scanV1:
                keepLocal: true
                targetType: framework
                targetNames:
                  - nsa
                  - mitre
                  - cis-v1.12.0
                  - security
    kubevulnScheduler:
      image:
        repository: quay.io/kubescape/http-request
        tag: v0.2.23@sha256:4ff502a33423cd362b7fd70e98b0ac2121799fb7df22d7def326e528cbec5685
      scanSchedule: "0 1 * * 0"
    # Template for operator-created registry-scan CronJobs (unused, pinned anyway).
    registryScanScheduler:
      image:
        repository: quay.io/kubescape/http-request
        tag: v0.2.23@sha256:4ff502a33423cd362b7fd70e98b0ac2121799fb7df22d7def326e528cbec5685
    operator:
      image:
        repository: quay.io/kubescape/operator
        tag: v0.2.204@sha256:b35dce37e168ac199d7ce6a5032dd10cdf2c6e618c74d007cd170e52332f3a83
    kubevuln:
      image:
        repository: quay.io/kubescape/kubevuln
        tag: v0.3.571@sha256:21b4dd46154617197bdf81d6972b879a96e73b2fec583725c8ceaae4f85f0f5a
      config:
        grypeDbPersistence: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
          ephemeral-storage: 2Gi
        limits:
          memory: 3Gi
          ephemeral-storage: 10Gi
    storage:
      image:
        repository: quay.io/kubescape/storage
        tag: v0.0.381@sha256:f81570011349038780fd0bf2f96835a41629c68f9573ecc03bb9decfa803dab6
      resources:
        requests:
          cpu: 200m
          memory: 400Mi
        limits:
          memory: 1500Mi
      kindQueues:
        # The 500KB default rejects (413) VEX documents for images with large
        # package sets; Helm merges this key into the chart's other defaults.
        openvulnerabilityexchangecontainers:
          maxObjectSize: 5000000
    nodeAgent:
      image:
        repository: quay.io/kubescape/node-agent
        tag: v0.3.299@sha256:1a40363136c33685a8ca131ab6c1661259ce3b0ce20c68c62b5b1e0ddc1bdfc6
      resources:
        requests:
          cpu: 100m
          memory: 600Mi
        limits:
          memory: 1400Mi
      config:
        extra:
          # Containers already running when node-agent starts get a "partial"
          # profile that kubevuln refuses to scan, yet node-agent still rewrites
          # it every updatePeriod for maxLearningPeriod. With runtimeDetection
          # off they have no other use, so skip them.
          partialProfileGenerationEnabled: false
    prometheusExporter:
      image:
        repository: quay.io/kubescape/prometheus-exporter
        tag: v0.2.27@sha256:3ffd2ba9d9a0bb5d82a50215b8271735ba1adee4e415e864f66941813355ede3
      enableWorkloadMetrics: true
      serviceMonitor:
        enabled: true
  postRenderers:
    - kustomize:
        patches:
          # The exporter emits its own `namespace`/`workload` labels; without
          # honorLabels Prometheus renames them to exported_* and every series
          # is attributed to the kubescape namespace.
          - target:
              group: monitoring.coreos.com
              kind: ServiceMonitor
              name: prometheus-exporter
            patch: |
              - op: add
                path: /spec/endpoints/0/honorLabels
                value: true
          # The chart has no dnsConfig value. Under the default ndots:5, CoreDNS
          # autopath answers the first search-path query with a CNAME, so the
          # toFQDNs rules in ciliumnetworkpolicy.yaml never match.
          - target:
              kind: Deployment
              name: kubescape|kubevuln
            patch: |
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
          # Read-only rules the chart omits (each was a recurring 403 in the
          # audit log). Secrets stay denied via enableClusterWideSecretAccess.
          - target:
              kind: ClusterRole
              name: operator
            patch: |
              - op: add
                path: /rules/-
                value:
                  apiGroups: [""]
                  resources: ["serviceaccounts"]
                  verbs: ["get"]
          - target:
              kind: ClusterRole
              name: kubescape
            patch: |
              - op: add
                path: /rules/-
                value:
                  apiGroups: ["admissionregistration.k8s.io"]
                  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
                  verbs: ["get", "list", "watch"]
              - op: add
                path: /rules/-
                value:
                  apiGroups: ["kubescape.io"]
                  resources: ["controlinputs", "securityexceptions", "clustersecurityexceptions"]
                  verbs: ["get", "list", "watch"]
              - op: add
                path: /rules/-
                value:
                  apiGroups: ["talos.dev"]
                  resources: ["serviceaccounts"]
                  verbs: ["get", "list", "watch"]
          - target:
              kind: ClusterRole
              name: storage
            patch: |
              - op: add
                path: /rules/-
                value:
                  apiGroups: [""]
                  resources: ["nodes"]
                  verbs: ["get", "list", "watch"]
