---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  # The chart has no allocateLoadBalancerNodePorts value; Cilium serves the LB IP
  # directly, so auto-allocated NodePorts would only add LAN exposure.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: k8s-gateway
            patch: |
              - op: add
                path: /spec/allocateLoadBalancerNodePorts
                value: false
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "192.168.5.2"
      externalTrafficPolicy: Cluster
    watchedResources: ["HTTPRoute", "Service"]
