---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: unifi-static-records
spec:
  endpoints:
    - dnsName: cluster.${SECRET_DOMAIN}
      recordType: A
      targets:
        - 192.168.5.50
        - 192.168.5.51
        - 192.168.5.52
    - dnsName: nas.${SECRET_DOMAIN}
      recordType: A
      targets:
        - 192.168.5.40
    - dnsName: syslog.${SECRET_DOMAIN}
      recordType: A
      targets:
        - 192.168.5.24
    - dnsName: minecraft.${SECRET_DOMAIN}
      recordType: A
      targets:
        - 192.168.5.25
    - dnsName: tor-relay.${SECRET_DOMAIN}
      recordType: A
      targets:
        - 192.168.5.22
    - dnsName: kromgo.${SECRET_DOMAIN}
      recordType: CNAME
      targets:
        - external.${SECRET_DOMAIN}
