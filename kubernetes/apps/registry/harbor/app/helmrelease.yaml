---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  chart:
    spec:
      chart: harbor
      version: 1.19.2
      sourceRef:
        kind: HelmRepository
        name: harbor
  interval: 1h
  # Secret-bearing values live in the SOPS-encrypted harbor-values Secret so
  # they never appear in the HelmRelease spec. literal keeps the JSON and bcrypt
  # strings verbatim instead of parsing commas/braces as --set syntax.
  valuesFrom:
    - kind: Secret
      name: harbor-values
      valuesKey: configureUserSettings
      targetPath: core.configureUserSettings
      literal: true
    - kind: Secret
      name: harbor-values
      valuesKey: databasePassword
      targetPath: database.internal.password
      literal: true
    - kind: Secret
      name: harbor-values
      valuesKey: registryPassword
      targetPath: registry.credentials.password
      literal: true
    - kind: Secret
      name: harbor-values
      valuesKey: registryHtpasswd
      targetPath: registry.credentials.htpasswdString
      literal: true
  values:
    expose:
      type: route
      # TLS terminates at envoy-internal; Harbor serves plain HTTP behind it.
      tls:
        enabled: false
      route:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hosts:
          - registry.${SECRET_DOMAIN}
    externalURL: https://registry.${SECRET_DOMAIN}

    existingSecretAdminPassword: harbor-secret
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    # Encrypts credentials Harbor stores in its DB (registry endpoints, OIDC
    # client secret). It must stay stable across upgrades and restores.
    existingSecretSecretKey: harbor-secret

    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        database:
          existingClaim: ${APP}
        redis:
          storageClass: iscsi
          size: 1Gi
        trivy:
          storageClass: iscsi
          size: 5Gi
      imageChartStorage:
        # Presigned redirects would point clients at the in-cluster Garage
        # Service, which they cannot reach; proxy blobs through the registry.
        disableredirect: true
        type: s3
        s3:
          existingSecret: harbor-s3
          # Garage's region is not an AWS region; distribution only accepts it
          # when regionendpoint is set (which also forces path-style URLs).
          region: garage
          regionendpoint: http://garage.storage.svc.cluster.local:3900
          bucket: harbor
          v4auth: true

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 1m

    core:
      image:
        repository: docker.io/goharbor/harbor-core
        tag: v2.15.2@sha256:d7b780d23721a000f0fb8e181add6675eafa336de5d033b77fd7da0c171ff7f7
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    portal:
      image:
        repository: docker.io/goharbor/harbor-portal
        tag: v2.15.2@sha256:b811b67f7a7f6f1614e4bdf7478b207d13e8aa3f815ff6ad84f216a5098d213d
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    jobservice:
      image:
        repository: docker.io/goharbor/harbor-jobservice
        tag: v2.15.2@sha256:f71a4452a095bcd2a8f0683648a3ae28415432df87ccfb00ec7625f3e340a598
      # Job logs go to PostgreSQL (backed up) instead of an extra PVC.
      jobLoggers:
        - database
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi

    registry:
      registry:
        image:
          repository: docker.io/goharbor/registry-photon
          tag: v2.15.2@sha256:c4ebef61ceb50a3d8bc21d149bc280422db20a1e69df317b64b74098c3615855
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
      controller:
        image:
          repository: docker.io/goharbor/harbor-registryctl
          tag: v2.15.2@sha256:223d5cb49d5dbf0ba4ae022e7dd9775fa459904112dc12084d3aaa36c1408362
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi

    trivy:
      image:
        repository: docker.io/goharbor/trivy-adapter-photon
        tag: v2.15.2@sha256:215c07b71c37fc7fc16e02d9185d936dcb8884a80e810817c2cd058bbd7c4e98
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    database:
      type: internal
      internal:
        image:
          repository: docker.io/goharbor/harbor-db
          tag: v2.15.2@sha256:5ebfb345b33d673fa8483ffc997013113b7d14ea56abfa65cfcb621b4acf3039
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi

    redis:
      type: internal
      internal:
        image:
          repository: docker.io/goharbor/valkey-photon
          tag: v2.15.2@sha256:7337783e8148f01a25b113f5c7b1d640f78b1860fcaf80a33d0dbb294f7b99d0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi

    exporter:
      image:
        repository: docker.io/goharbor/harbor-exporter
        tag: v2.15.2@sha256:e1b0a248f61aad5084c5d1612d5f1da89f99c23ce743eaf8cba913d6d00c0547
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
