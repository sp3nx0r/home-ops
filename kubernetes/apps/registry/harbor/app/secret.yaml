---
# The Garage key is shared with the garage HelmRelease, so both sides read it
# from cluster-secrets via Flux postBuild substitution (see harbor ks.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: harbor-s3
type: Opaque
stringData:
  REGISTRY_STORAGE_S3_ACCESSKEY: ${HARBOR_S3_KEY_ID}
  REGISTRY_STORAGE_S3_SECRETKEY: ${HARBOR_S3_SECRET_KEY}
