---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kyverno
spec:
  # Namespace-wide: covers all four controllers plus the chart's hook Jobs.
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: kyverno
  ingress:
    # Prometheus scrape (all controllers expose metrics on 8000)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # kube-apiserver -> admission/cleanup webhooks, plus kubelet probes (same
    # port). The apiserver is host-networked on the control-plane nodes, so it
    # presents as host (same node) or remote-node (cross node).
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
