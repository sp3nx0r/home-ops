---
# KOPIA_PASSWORD is injected from the cluster-secrets Secret via Flux
# postBuild substitution (see the garage ks.yaml substituteFrom).
apiVersion: v1
kind: Secret
metadata:
  name: garage-volsync-secret
type: Opaque
stringData:
  KOPIA_PASSWORD: ${KOPIA_PASSWORD}
  KOPIA_REPOSITORY: filesystem:///mnt/repository
