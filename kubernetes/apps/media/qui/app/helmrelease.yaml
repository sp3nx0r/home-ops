---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
spec:
  chartRef:
    kind: OCIRepository
    name: qui
  interval: 1h
  values:
    controllers:
      qui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.30.0@sha256:1172ca40283330445d61189263a65a31ba703770a230b9e2a913f6e57bc2dd23
            env:
              QUI__HOST: 0.0.0.0
              QUI__PORT: &port 80
              # Native OIDC (Pocket ID) — qui enforces auth itself, so hitting
              # the ClusterIP directly cannot bypass SSO (finding #3). Built-in
              # login is disabled so OIDC is the only auth path.
              QUI__OIDC_ENABLED: true
              QUI__OIDC_ISSUER: "https://id.${SECRET_DOMAIN}"
              QUI__OIDC_CLIENT_ID: "bacca251-5e41-430f-ae6a-c556df93abc9"
              QUI__OIDC_REDIRECT_URL: "https://qui.${SECRET_DOMAIN}/api/auth/oidc/callback"
              QUI__OIDC_DISABLE_BUILT_IN_LOGIN: true
              QUI__OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: qui-oidc-secret
                    key: client-secret
              TZ: America/Chicago
            envFrom:
              - secretRef:
                  name: qui-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "qui.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: qui
      tmpfs:
        type: emptyDir
        advancedMounts:
          qui:
            app:
              - path: /tmp
                subPath: tmp
