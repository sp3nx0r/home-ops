---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qui
spec:
  # qBittorrent web manager. Selecting it makes it default-deny. It manages the
  # qbittorrent instances (intra-media) and authenticates via native OIDC to
  # Pocket ID at id.${SECRET_DOMAIN}, which resolves to the envoy-internal VIP
  # (LB-translated to the envoy-internal backend on :10443).
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: media
      app.kubernetes.io/name: qui
  ingress:
    # Proxied UI from the internal gateway + intra-media + kubelet probe
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - matchLabels:
            io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    # DNS resolution (L7 so lookups are visible to Cilium's DNS proxy)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Intra-media trust zone (manages the qbittorrent instances)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
    # Internal gateway: Pocket ID OIDC token exchange (:10443) and reaching the
    # managed qbittorrent web UIs via their internal ingress hostnames, which
    # hit the HTTP listener (:10080) before redirecting to HTTPS. The gateway
    # terminates both, so the backend namespace is irrelevant.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
            - port: "10080"
              protocol: TCP
    # Update checks over HTTPS
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
