---
# Recyclarr sync for TRaSH Guides quality profiles and custom formats.
# LG Direct Play goal: prefer AAC / EAC3 (DD+), avoid DTS / TrueHD / FLAC / PCM.
sonarr:
  series:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      episodes:
        anime: default
        daily: default
        rename: true
        standard: default
      season: default
      series: plex-imdb

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p (default for LG)
        reset_unmatched_scores:
          enabled: true
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p (selective / premium)
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: d920fd959d220306888f40b6f38e1578 # Season Packs
          assign_scores_to:
            - trash_id: 72dae194fc92bf828f32cde7744e51a1
            - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
        - trash_id: 158188097a58d7687dee647e04af0da3 # Golden Rule HD
          assign_scores_to:
            - trash_id: 72dae194fc92bf828f32cde7744e51a1
            - trash_id: d1498e7d189fbe6c7110ceaabb7473e6

    custom_formats:
      # Release quality
      - trash_ids:
          - 5d9fd1b1e06cd8a475462f40214b7df6 # FLUX
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: 100
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            score: 100
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6

      # Season packs (boost for seasonpackerr)
      - trash_ids:
          - 3bc5f395426614e155e585a2f056cdf1 # Season Pack
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: 100
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            score: 100

      # LG Direct Play: prefer AAC and EAC3 (DD+)
      - trash_ids:
          - a50b8a0c62274a7c38b09a9619ba9d86 # AAC
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: 3000
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            score: 3000
      - trash_ids:
          - 63487786a8b01b7f20dd2bc90dd4a477 # DD+ / EAC3
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: 500
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            score: 500

      # LG Direct Play: avoid audio that forces Plex remux on the TV
      - trash_ids:
          - 5964f2a8b3be407d083498e4459d05d0 # DTS
          - c429417a57ea8c41d57e6990a8b0033f # DTS-HD MA
          - cfa5fbd8f02a86fc55d8d223d06a5e1f # DTS-HD HRA
          - c1a25cd67b5d2e08287c957b1eb903ec # DTS-ES
          - 9d00418ba386a083fbf4d58235fc37ef # DTS X
          - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
          - 0d7824bb924701997f874e7ff7d4844a # TrueHD ATMOS
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: -15000
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            score: -15000
      - trash_ids:
          - 851bd64e04c9374c51102be3dd9ae4cc # FLAC
          - 30f70576671ca933adbdcfc736a69718 # PCM
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: -10000
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            score: -10000

      # HDR: avoid DV without HDR10 fallback on 2160p profile
      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca # DV (w/o HDR fallback)
        assign_scores_to:
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            score: -10000

      # Prefer HEVC when otherwise equal (LG Direct Plays HEVC well)
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: 300
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            score: 300

radarr:
