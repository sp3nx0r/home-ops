---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  chartRef:
    kind: OCIRepository
    name: plex
  interval: 1h
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Plex logs to files on the config PVC, not stdout; stream the
          # server log so Vector ships it to Loki. Native sidecar so it
          # captures Plex startup/shutdown. The trap is needed because
          # tail as PID 1 ignores SIGTERM.
          logs:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4
            restartPolicy: Always
            command:
              - sh
              - -c
              - 'trap "exit 0" TERM; tail -n 0 -F "$1" & wait'
              - tail
              - /config/Library/Application Support/Plex Media Server/Logs/Plex Media Server.log
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            env:
              TZ: America/Chicago
              PLEX_ADVERTISE_URL: http://192.168.5.21:32400,https://plex.${SECRET_DOMAIN}:443,http://plex.media.svc.cluster.local:32400
              # Treat physical LAN subnets as local (Settings > Network > LAN Networks).
              # Applied on every start via the image's generic PLEX_PREFERENCE_* injector,
              # so it survives a config PVC rebuild.
              PLEX_PREFERENCE_1: "LanNetworksBandwidth=192.168.0.0/24,192.168.1.0/24,192.168.5.0/24"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity?kube-probe=1
                    port: &port 32400
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity?kube-probe=1
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        annotations:
          lbipam.cilium.io/ips: "192.168.5.21"
        # Preserve client source IPs so Plex classifies LAN clients as local
        # (see Settings > Network > LAN Networks / LanNetworksBandwidth).
        externalTrafficPolicy: Local
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            conditions:
              - "[CONNECTED] == true"
              - "[STATUS] == 401"
        hostnames:
          - "plex.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: X-Plex-Http-Pipeline
                      value: infinite
    persistence:
      config:
        existingClaim: plex
        advancedMounts:
          plex:
            app:
              - path: /config
            logs:
              - path: /config
                readOnly: true
      media:
        type: nfs
        server: 192.168.5.40
        path: /mnt/tank/media
        advancedMounts:
          plex:
            app:
              - path: /media
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          plex:
            app:
              - path: /tmp
      transcode:
        type: emptyDir
        advancedMounts:
          plex:
            app:
              - path: /transcode
