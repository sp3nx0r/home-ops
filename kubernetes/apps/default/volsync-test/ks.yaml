---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync-test
spec:
  interval: 1h
  path: ./kubernetes/apps/default/volsync-test/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: volsync
      namespace: volsync-system
  postBuild:
    substitute:
      APP: volsync-test
      # Kopia's local cache is evicted by total bytes, never by file count, so
      # the many tiny index-blob files exhaust ext4 inodes long before the byte
      # cap. 4Gi ~= 262k inodes, giving headroom above the observed peak between
      # the daily cache scrub runs.
      VOLSYNC_CAPACITY: 4Gi
      VOLSYNC_UID: "1000"
      VOLSYNC_GID: "1000"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  wait: false
