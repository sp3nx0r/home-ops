---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The honeypot's Loki rule ConfigMap lives in o11y (the rules sidecar only
# watches there), so this has no targetNamespace; app manifests pin theirs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opencanary
spec:
  interval: 1h
  path: ./kubernetes/apps/security/opencanary/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
