---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap-v1.json
# Picked up by the Loki chart's rules sidecar (label loki_rule), which only
# watches the o11y namespace. Decoy names must stay in sync with the Secrets in
# this directory and docs/runbooks/runbook-canarytokens.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules-credential-access
  namespace: o11y
  labels:
    loki_rule: "true"
data:
  credential-access.yaml: |
    groups:
      - name: credential-access
        rules:
          # Any direct read/write of a decoy Secret, successful or denied.
          # kustomize-controller server-side-applies them every reconcile
          # (get + patch); kubelets only watch Secrets that are mounted, and
          # nothing mounts these.
          - alert: CanarySecretAccessed
            expr: |
              sum by (user, verb, namespace, name, code, user_agent, source_ip) (
                count_over_time(
                  {source="kube-audit"} |= `"resource":"secrets"` |~ `"name":"(aws-backup-credentials|headlamp-admin-kubeconfig|registry-credentials)"`
                    | json user="user.username", namespace="objectRef.namespace", name="objectRef.name", code="responseStatus.code", user_agent="userAgent", source_ip="sourceIPs[0]"
                    | (namespace="default" and name="aws-backup-credentials") or (namespace="o11y" and name="headlamp-admin-kubeconfig") or (namespace="media" and name="registry-credentials")
                    | (user!="system:serviceaccount:flux-system:kustomize-controller" or verb!~"get|patch|create")
                  [5m]
                )
              ) > 0
            for: 0m
            labels:
              severity: critical
              category: security
              source: loki-ruler
            annotations:
              summary: "Decoy Secret {{ $labels.namespace }}/{{ $labels.name }} was accessed"
              description: >-
                {{ $labels.user }} performed '{{ $labels.verb }}' (HTTP {{ $labels.code }})
                on decoy Secret {{ $labels.namespace }}/{{ $labels.name }} from
                {{ $labels.source_ip }} using '{{ $labels.user_agent }}'. Nothing
                legitimate reads this Secret; treat the principal as compromised.
                Runbook: docs/runbooks/runbook-canarytokens.md
          # Unfiltered Secret lists return the decoys' contents without naming
          # them. Label-selected lists are ignored only when the selector
          # positively requires a key the decoys never carry (Helm storage,
          # Grafana/Loki sidecars); negated selectors still alert.
          - alert: SecretsBulkListed
            expr: |
              sum by (user, namespace, user_agent, source_ip) (
                count_over_time(
                  {source="kube-audit", verb="list"} |= `"resource":"secrets"`
                    | json user="user.username", namespace="objectRef.namespace", name="objectRef.name", uri="requestURI", user_agent="userAgent", source_ip="sourceIPs[0]"
                    | name=""
                    | namespace=~"(default|media|o11y)?"
                    | user!="system:serviceaccount:kube-system:namespace-controller"
                    | uri!~".*[?&]labelSelector=([^&]*(%2C|,))?(owner|grafana_dashboard|grafana_datasource|loki_rule)((%3D|=){1,2}[^&%,]*)?((%2C|,)[^&]*)?(&.*)?"
                  [5m]
                )
              ) > 0
            for: 0m
            labels:
              severity: warning
              category: security
              source: loki-ruler
            annotations:
              summary: "Secrets listed {{ if $labels.namespace }}in {{ $labels.namespace }}{{ else }}cluster-wide{{ end }} by {{ $labels.user }}"
              description: >-
                {{ $labels.user }} listed Secrets {{ if $labels.namespace }}in namespace
                {{ $labels.namespace }}{{ else }}across all namespaces{{ end }} from
                {{ $labels.source_ip }} using '{{ $labels.user_agent }}'. The
                response included decoy credentials. Expected only when you ran
                `kubectl get secrets` yourself.
                Runbook: docs/runbooks/runbook-canarytokens.md
