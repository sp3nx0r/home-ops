---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector-syslog
spec:
  chartRef:
    kind: OCIRepository
    name: vector-syslog
  interval: 1h
  # The chart has no allocateLoadBalancerNodePorts value; Cilium serves the LB IP
  # directly, so auto-allocated NodePorts would only add LAN exposure.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: vector-syslog
            patch: |
              - op: add
                path: /spec/allocateLoadBalancerNodePorts
                value: false
  values:
    role: Stateless-Aggregator

    replicas: 1

    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: 0.0.0.0:8686
      sources:
        syslog:
          # UniFi/UDM OS emits a non-standard RFC3164 header with a DOUBLED
          # hostname (`<PRI>TS HOST HOST TAG`) that the built-in `syslog`
          # source rejects and silently drops over UDP. Decode raw bytes and
          # parse syslog in VRL after collapsing the duplicate hostname.
          type: socket
          address: 0.0.0.0:5140
          mode: udp
          host_key: source_ip
          decoding:
            codec: bytes
        internal_metrics:
          type: internal_metrics
      transforms:
        syslog_parse:
          type: remap
          inputs: ["syslog"]
          source: |
            # The `socket` source hands us the raw datagram in .message, including
            # any trailing newline -- strip it so the anchored regexes below match.
            raw = strip_whitespace(to_string(.message) ?? "")
            # UniFi/UDM OS doubles the hostname (`<PRI>TS HOST HOST TAG`), which the
            # built-in syslog parser rejects; VRL regex has no backreferences, so
            # match both hostname tokens and compare, then collapse before parsing.
            dh, dherr = parse_regex(raw, r'^(?P<pri><\d+>\w{3}\s+\d+\s[0-9:]+\s)(?P<h1>\S+)\s+(?P<h2>\S+)\s(?P<rest>.*)$')
            if dherr == null && dh.h1 == dh.h2 {
              raw = string!(dh.pri) + string!(dh.h1) + " " + string!(dh.rest)
            }
            # BSD/RFC3164 headers (UniFi/UDM) carry local wall-clock with no zone, so
            # parse_syslog reads them as UTC; re-zoned to local time further below.
            bsd = match(raw, r'^<\d+>\w{3}\s+\d+\s[0-9:]+\s')
            parsed, perr = parse_syslog(raw)
            if perr == null {
              . = merge(., parsed)
            } else {
              .message = raw
            }
            .host = del(.hostname)
            .severity = del(.severity)
            .facility = del(.facility)
            .app = del(.appname)
            del(.procid)
            del(.msgid)
            del(.version)
            del(.port) # socket source adds the sender's ephemeral port; drop noise
            # UniFi CEF: the RFC3164 parser splits a spaced device name across
            # hostname/appname/message, and the syslog header is local time.
            msg_str = to_string(.message)
            if contains(msg_str, "CEF:") {
              cef_split, err = parse_regex(msg_str, r'^(?P<prefix>.*?)\s*(?P<cef>CEF:.*)$')
              if err == null {
                .host = join!(compact([.host, .app, cef_split.prefix]), " ")
                msg_str = string!(cef_split.cef)
                .message = msg_str
              }
              epoch, err = parse_regex(msg_str, r'\stimestamp=(?P<ms>\d{13})\b')
              if err == null {
                .timestamp = from_unix_timestamp!(to_int!(epoch.ms), unit: "milliseconds")
              } else if is_timestamp(.timestamp) {
                local = format_timestamp!(.timestamp, "%Y-%m-%dT%H:%M:%S")
                .timestamp = parse_timestamp(local, "%Y-%m-%dT%H:%M:%S", timezone: "America/Chicago") ?? .timestamp
              }
              cef_parts = split(msg_str, "|")
              if length(cef_parts) >= 6 {
                .app = cef_parts[1]
                .cef_event = cef_parts[5]
              }
              device_name, err = parse_regex(msg_str, r'UNIFIdeviceName=(?P<name>.+?)\sUNIFIdeviceModel')
              if err == null {
                .host = device_name.name
              }
            }
            # Zone-less BSD syslog (UniFi/UDM) is parsed as UTC; re-interpret as local.
            if bsd && !contains(msg_str, "CEF:") && is_timestamp(.timestamp) {
              local = format_timestamp!(.timestamp, "%Y-%m-%dT%H:%M:%S")
              .timestamp = parse_timestamp(local, "%Y-%m-%dT%H:%M:%S", timezone: "America/Chicago") ?? .timestamp
            }
            # TrueNAS forwards multi-line middleware logs (e.g. pydantic
            # serialization errors) as separate UDP frames whose continuation
            # lines carry no valid <PRI>/APP-NAME. syslog-ng then mis-parses a
            # random message token as the program name, polluting the `app`
            # label (and Loki's derived `service_name`) with values like `,`,
            # `model_type,` or `input_type=str]`. Collapse anything that is not
            # a plausible syslog program name into a single bucket.
            app = to_string(.app) ?? ""
            if !match(app, r'^[A-Za-z0-9(][A-Za-z0-9._/()\-]{0,31}$') {
              .app = "unknown"
            }
        syslog_filter:
          type: filter
          inputs: ["syslog_parse"]
          # Drop the repeating TrueNAS middleware pydantic serialization error
          # and its split continuation fragments -- benign spam (~every 40s)
          # that only shows up as malformed labels and broken log lines.
          condition: |
            msg = to_string(.message) ?? ""
            drop = contains(msg, "errors.pydantic.dev") ||
              contains(msg, "validation error for") ||
              contains(msg, "input_type=") ||
              contains(msg, "input_value=")
            !drop
      sinks:
        loki:
          type: loki
          dangerously_allow_unconfined_template_resolution: true
          inputs: ["syslog_filter"]
          endpoint: http://loki-gateway.o11y.svc.cluster.local
          buffer:
            type: disk
            max_size: 268435488
            when_full: drop_newest
          request:
            concurrency: 2
            retry_max_duration_secs: 30
          encoding:
            codec: json
          labels:
            host: '{{ "{{ host }}" }}'
            severity: '{{ "{{ severity }}" }}'
            facility: '{{ "{{ facility }}" }}'
            app: '{{ "{{ app }}" }}'
            source: syslog
          out_of_order_action: accept
        # Sink name must map to the chart's PodMonitor port `prom-exporter`.
        # Vector derives the container-port name from the sink key, and k8s
        # truncates port names to 15 chars -- `prometheus_exporter` becomes
        # `prometheus-expo`, which does NOT match the PodMonitor, so scrapes
        # silently fail. `prom_exporter` -> `prom-exporter` (matches).
        prom_exporter:
          type: prometheus_exporter
          inputs: ["internal_metrics"]
          address: 0.0.0.0:9090

    service:
      enabled: true
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "192.168.5.24"
      ports:
        - name: syslog
          port: 514
          protocol: UDP
          targetPort: 5140

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      fsGroupChangePolicy: OnRootMismatch

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

    podMonitor:
      enabled: true

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
