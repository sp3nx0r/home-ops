---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  # Dashboards UI. Selecting it makes it default-deny. It listens on :3000 and
  # queries three datasources (Thanos query-frontend, Alertmanager, Loki), does
  # OIDC against Pocket ID via the internal gateway VIP, watches the apiserver
  # for dashboard/datasource ConfigMaps (sidecars, searchNamespace ALL), and
  # downloads dashboard JSON from grafana.com + githubusercontent (world:443).
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: o11y
      app.kubernetes.io/name: grafana
  ingress:
    # User traffic proxied from the internal gateway :3000
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Prometheus scrape :3000 + kubelet httpGet probe :3000
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS resolution (L7 so lookups are visible to Cilium's DNS proxy)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Prometheus datasource -> Thanos query-frontend :9090
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: thanos
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Alertmanager datasource :9093
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # Loki datasource -> loki-gateway (nginx) :8080
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # OIDC (Pocket ID) via id.${SECRET_DOMAIN} -> envoy-internal VIP :10443
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Dashboard-sidecars watch the apiserver for ConfigMaps (searchNamespace ALL)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Dashboard JSON downloads from grafana.com + raw.githubusercontent.com
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
