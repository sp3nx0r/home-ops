---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
spec:
  chart:
    spec:
      chart: thanos
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: thanos-community
  interval: 1h
  upgrade:
    timeout: 30m
  values:
    global:
      objstore:
        createSecret: false
        secretName: thanos-objstore-secret
        secretKey: objstore.yml
      thanosRules:
        enabled: true
        alertOverrides:
          ThanosCompactHalted:
            severity: critical

    kube-prometheus-stack:
      enabled: false

    query:
      enabled: true
      replicaCount: 1
      replicaLabels:
        - __replica__
      # Fail queries when a store is unreachable instead of silently returning
      # sidecar-only (recent) data.
      extraArgs:
        - --no-query.partial-response
      endpoints:
        autogen:
          enabled: true
        static:
          - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.o11y.svc.cluster.local
      httpRoute:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "thanos.${SECRET_DOMAIN}"
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi

    queryFrontend:
      enabled: true
      replicaCount: 1
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

    storegateway:
      enabled: true
      replicaCount: 1
      persistence:
        enabled: true
        size: 5Gi
        storageClass: iscsi
      # Reject oversized Series calls with an error rather than OOMing on
      # long-range, high-cardinality queries (~450k head series).
      extraArgs:
        - --store.limits.request-series=100000
        - --store.limits.request-samples=50000000
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    compactor:
      enabled: true
      replicaCount: 1
      persistence:
        enabled: true
        # Scratch for downloading + rewriting blocks; 2w→longer merges need ~2x input size.
        # 10Gi filled and halted on a 6-block (~9.5Gi) compaction (preallocate ENOSPC).
        size: 50Gi
        storageClass: iscsi
      retention:
        resolutionRaw: 14d
        resolution5m: 30d
        resolution1h: 90d
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    receive:
      enabled: false
    ruler:
      enabled: false
    bucket:
      enabled: false
