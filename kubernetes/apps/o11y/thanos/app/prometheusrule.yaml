---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: thanos
spec:
  groups:
    # The Thanos chart already ships the full thanos-mixin PrometheusRule
    # (thanos-rules: compact/query/store/component-absent alerts), so we only
    # add the one gap it does not cover: the sidecar that runs alongside the
    # kube-prometheus-stack Prometheus. Dashboards for Thanos live in the grafana
    # HelmRelease.
    - name: thanos-sidecar.rules
      rules:
        - alert: ThanosSidecarPrometheusDown
          expr: thanos_sidecar_prometheus_up == 0
          for: 5m
          annotations:
            summary: >-
              Thanos sidecar cannot reach its Prometheus
            description: >-
              The Thanos sidecar reports its Prometheus is unreachable
              (thanos_sidecar_prometheus_up=0) for 5m. Fresh blocks will not be
              shipped to object storage and the sidecar store API will not serve
              recent data.
          labels:
            severity: critical
