---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  chart:
    spec:
      chart: headlamp
      version: 0.45.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  interval: 1h
  values:
    config:
      inCluster: true
      inClusterContextName: homelab
      # The pluginsManager sidecar is a regular container (not an initContainer)
      # that downloads plugins from the internet at pod start. Without this the
      # backend scans the plugin dir once at boot -- before the sidecar finishes
      # -- and never re-scans, so freshly installed plugins never appear until a
      # manual restart. Watching the dir picks them up as they land.
      watchPlugins: true
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
          hasScopes: true
      extraArgs:
        - -oidc-callback-url=https://headlamp.${SECRET_DOMAIN}/oidc-callback
        # Load init-copied plugins from a second dir the pluginsManager sidecar
        # does not manage. The sidecar prunes -plugins-dir (/headlamp/plugins) to
        # only its configured Artifact Hub plugins, so the Cilium plugin must live
        # elsewhere or it gets deleted on every sidecar sync.
        - -user-plugins-dir=/headlamp/user-plugins
    # The Cilium plugin (giantswarm/headlamp-cilium) is not published to Artifact
    # Hub, so it can't be installed via pluginsManager. Instead the plugin files
    # ship in a container image (/plugins/headlamp-cilium) which this initContainer
    # copies into the user-plugins volume before the backend starts. No internet
    # egress is needed (the bundle is baked into the image).
    initContainers:
      - name: cilium-plugin
        image: gsoci.azurecr.io/giantswarm/headlamp-cilium:0.1.11@sha256:2474b8f5ae898bee0bb88418340c3dcce1e7723e140d65f1b3e8c2468d176d8e
        command:
          - /bin/sh
          - -c
          - |
            mkdir -p /headlamp/user-plugins/headlamp-cilium
            cp -r /plugins/headlamp-cilium/. /headlamp/user-plugins/headlamp-cilium/
        volumeMounts:
          - name: user-plugins
            mountPath: /headlamp/user-plugins
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.7.0
        installOptions:
          parallel: true
          maxConcurrent: 2
    clusterRoleBinding:
      create: true
      clusterRoleName: view
    service:
      type: ClusterIP
      port: 80
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
      hostnames:
        - "headlamp.${SECRET_DOMAIN}"
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    volumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: config
        mountPath: /home/headlamp/.config
      # Cilium plugin, populated by the cilium-plugin initContainer and served
      # via -user-plugins-dir.
      - name: user-plugins
        mountPath: /headlamp/user-plugins
    volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        emptyDir: {}
      - name: user-plugins
        emptyDir: {}
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
        ephemeral-storage: 50Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 256Mi
