---
# Cluster access for Pocket ID OIDC identities forwarded by Headlamp.
# Subjects use the "oidc:" prefix mapped by the kube-apiserver
# AuthenticationConfiguration (talos/control-plane/00-cluster.yaml).
# Group names must match exactly what Pocket ID emits in the groups claim
# (Pocket ID slugifies group names with underscores, e.g. k8s_admins).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-oidc-viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:k8s_viewers"
---
# Deliberately not cluster-admin: an IdP compromise or a Pocket ID group edit
# must not yield the cluster. cluster-admin is only reachable via the
# talosctl-generated kubeconfig (docs/runbooks/runbook-break-glass-access.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-oidc-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:k8s_admins"
