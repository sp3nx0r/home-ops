---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backblaze-exporter
spec:
  # Backblaze B2 bucket metrics exporter. Selecting it makes it default-deny.
  # Ingress: Prometheus scrape + kubelet probe on :52000. Egress: DNS + the
  # Backblaze B2 API over world:443.
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: o11y
      app.kubernetes.io/name: backblaze-exporter
  ingress:
    # Prometheus scrape :52000 + kubelet httpGet probe :52000
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "52000"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "52000"
              protocol: TCP
  egress:
    # DNS resolution (L7 so lookups are visible to Cilium's DNS proxy)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Backblaze B2 API over HTTPS
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
