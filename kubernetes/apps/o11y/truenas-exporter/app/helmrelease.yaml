---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: truenas-exporter
  interval: 1h
  values:
    controllers:
      truenas-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/unknowlars/truenas-scale-api-prometheus-exporter
              tag: 2026.03.29-bf8ede9@sha256:1fb579d1f17908e60208d197b709f6299604d9b727342d09c0d4d8a147b4a6a5
            env:
              TZ: America/Chicago
              PYTHONDONTWRITEBYTECODE: "1"
              TRUENAS_WS_URL: wss://192.168.5.40/api/current
              TRUENAS_VERIFY_TLS: "false"
              EXPORTER_PORT: "9108"
              SCRAPE_INTERVAL_SECONDS: "30"
              ENABLE_DATASET_METRICS: "true"
              ENABLE_TASK_METRICS: "true"
            envFrom:
              - secretRef:
                  name: truenas-exporter-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 9108
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
            interval: 30s
            scrapeTimeout: 15s
