---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki
spec:
  # Gateway (nginx front door). Selecting it makes it default-deny; nginx
  # listens on pod port 8080 (Service loki-gateway :80 -> 8080), the exporter
  # sidecar on 4040.
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: o11y
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: gateway
  ingress:
    # Log push (Vector agent + vector-syslog, both carry name=vector) and
    # Grafana datasource queries (server-side proxy) hit nginx :8080
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: vector
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Prometheus scrape of the nginx exporter sidecar :4040
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
    # kubelet probes: nginx readiness :8080 + exporter liveness/readiness :4040
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "4040"
              protocol: TCP
  egress:
    # Proxy to the single-binary backend HTTP :3100
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # DNS resolution (L7 so lookups are visible to Cilium's DNS proxy)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-backend
spec:
  # Backend (single binary). Selecting it makes it default-deny; loki listens
  # on :3100 (http/metrics), :9095 (grpc), :7946 (memberlist); a loki-sc-rules
  # sidecar exposes :8080 and watches the K8s API for rule ConfigMaps.
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: o11y
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: single-binary
  ingress:
    # Gateway proxies all read/write traffic to the backend HTTP :3100
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: gateway
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # Prometheus scrape of loki metrics :3100
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # kubelet probes: loki readiness :3100 + loki-sc-rules liveness/readiness :8080
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # memberlist gossip :7946 (single replica -> self only)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "7946"
              protocol: TCP
  egress:
    # Object storage: Garage S3 API in the storage namespace :3900
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: storage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    # loki-sc-rules sidecar watches the Kubernetes API for rule ConfigMaps
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # memberlist gossip :7946 (single replica -> self only)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "7946"
              protocol: TCP
    # DNS resolution (L7 so lookups are visible to Cilium's DNS proxy)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
