ef_resource!=`secrets` or user_username!=`system:serviceaccount:o11y:kube-prometheus-stack-operator`) and (objectRef_resource!=`secrets` or user_username!=`system:serviceaccount:cert-manager:cert-manager`) and (objectRef_resource!=`deployments` or user_username!=`system:serviceaccount:network:envoy-gateway` and user_username!=`system:serviceaccount:kube-system:reloader`) and (objectRef_resource!=`secrets` or verb!=`list` or user_username!=`system:serviceaccount:o11y:grafana`) and objectRef_subresource!~`.+` | label_format user=user_username, resource=objectRef_resource, subresource=objectRef_subresource, name=objectRef_name [5m])
