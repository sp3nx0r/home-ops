---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  chartRef:
    kind: OCIRepository
    name: loki
  interval: 1h
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      ingester:
        chunk_encoding: snappy
      querier:
        max_concurrent: 2
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        retention_period: 720h
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        per_stream_rate_limit: 5MB
        per_stream_rate_limit_burst: 15MB
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      compactor:
        retention_enabled: true
        delete_request_store: s3
        compaction_interval: 30m
      storage:
        type: s3
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
        s3:
          endpoint: garage.storage.svc.cluster.local:3900
          region: garage
          accessKeyId: "${LOKI_S3_KEY_ID}"
          secretAccessKey: "${LOKI_S3_SECRET_KEY}"
          s3ForcePathStyle: true
          insecure: true
      commonConfig:
        replication_factor: 1
      # Rule groups come only from ConfigMaps labeled loki_rule="true" (any
      # namespace), which the loki-sc-rules sidecar writes to /rules/fake --
      # `fake` is the tenant ID while auth_enabled is false. The local store is
      # read-only, so the ruler API cannot create rules; Git is the only source.
      # One unparseable file blocks every reload for the tenant: the rules
      # already loaded keep running, but a restart would start with none (see
      # the LokiRuler* alerts and docs/loki-ruler-detections.md).
      rulerConfig:
        storage:
          type: local
          local:
            directory: /rules
        alertmanager_url: http://kube-prometheus-stack-alertmanager.o11y.svc.cluster.local:9093
        external_labels:
          source: loki-ruler

    sidecar:
      # Namespace-prefixed file names so equal data keys in different
      # ConfigMaps cannot overwrite each other.
      enableUniqueFilenames: true
      rules:
        folder: /rules/fake
        labelValue: "true"
        searchNamespace: ALL
        resource: configmap

    singleBinary:
      replicas: 1
      persistence:
        storageClass: iscsi
        size: 5Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    gateway:
      enabled: true
      verboseLogging: false
      image:
        registry: docker.io
        repository: nginxinc/nginx-unprivileged
        tag: 1.31-alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      metrics:
        image:
          registry: ghcr.io
          repository: jkroepke/access-log-exporter
          tag: 0.4.21@sha256:3cb30dcc03071b3f35ff06b1ed426ae712acb351469dc6349ced68d4ba18c54a
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 96Mi

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    minio:
      enabled: false

    lokiCanary:
      enabled: false

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

    test:
      enabled: false

    monitoring:
      serviceMonitor:
        enabled: true

  # The chart's ClusterRole lets the rules sidecar read configmaps AND secrets
  # cluster-wide (for `resource: both`). Rules only come from ConfigMaps, so drop
  # secrets. Patched in place because a ClusterRoleBinding's roleRef is immutable.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: loki-clusterrole
            patch: |
              - op: replace
                path: /rules
                value:
                  - apiGroups: [""]
                    resources: ["configmaps"]
                    verbs: ["get", "list", "watch"]
