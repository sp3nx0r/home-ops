---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/coredns/charts/coredns
  ref:
    # Held on chart 1.46.2 (CoreDNS 1.13.1). CoreDNS >=1.14.3 breaks autopath on
    # cache prefetch (empty synthetic remote addr defeats AutoPath source-pod
    # match), so serve_stale can return a cached NXDOMAIN ahead of the real
    # answer for in-cluster lookups. See coredns/coredns#8390. Renovate hold in
    # .renovaterc.json5 keeps this pinned until upstream ships a fix.
    tag: 1.46.2
