---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  chartRef:
    kind: OCIRepository
    name: vector
  interval: 1h
  values:
    role: Agent

    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: 0.0.0.0:8686
      sources:
        kubernetes_logs:
          type: kubernetes_logs
          read_from: end
          # Re-scan for new/idle pod log files every 5s instead of the
          # 60s default, for near-real-time log delivery (source lag p95
          # ~60s -> a few seconds). Measured CPU overhead is negligible
          # (~single-digit millicores/pod) since the nodes are near-idle.
          glob_minimum_cooldown_ms: 5000
        internal_metrics:
          type: internal_metrics
        # kube-apiserver audit log. Talos writes it to a host file (not stdout),
        # and Vector already hostPath-mounts /var/log, so it is readable here.
        kube_audit:
          type: file
          include:
            - /var/log/audit/kube/*.log
          read_from: end
        # Hubble policy-denied flows written by the Cilium dynamic flowlog
        # exporter (see cilium helmrelease hubble.export). The glob also covers
        # rotated backups so a file renamed mid-read is still drained.
        hubble_drops:
          type: file
          include:
            - /var/run/cilium/hubble/policy-drops*.log
          read_from: beginning
      transforms:
        kube_parse:
          type: remap
          inputs: ["kubernetes_logs"]
          source: |
            .namespace = .kubernetes.pod_namespace
            .pod = .kubernetes.pod_name
            .container = .kubernetes.container_name
            .node = .kubernetes.pod_node_name
            del(.kubernetes)
            del(.file)
            del(.source_type)

            parsed, err = parse_json(.message)
            if err == null && is_object(parsed) {
              raw = del(.message)
              . = merge!(., parsed)
              if exists(.msg) && !exists(.message) {
                .message = del(.msg)
              }
              if !exists(.message) {
                .message = raw
              }
              if exists(.msg) {
                del(.msg)
              }
            }

            if !exists(.level) && exists(.severity) {
              .level = del(.severity)
            }
            if !exists(.level) {
              msg = to_string(.message) ?? ""
              if starts_with(msg, "E") || contains(msg, " [error]") || contains(msg, "\"level\":\"error\"") || contains(msg, "level=error") {
                .level = "error"
              } else if starts_with(msg, "W") || contains(msg, " [warn") || contains(msg, "\"level\":\"warn") || contains(msg, "level=warn") {
                .level = "warn"
              } else if starts_with(msg, "I") || contains(msg, " [info]") || contains(msg, "\"level\":\"info\"") || contains(msg, "level=info") {
                .level = "info"
              } else if starts_with(msg, "D") || contains(msg, " [debug]") || contains(msg, "\"level\":\"debug\"") || contains(msg, "level=debug") {
                .level = "debug"
              }
            }
            if exists(.level) {
              .level = downcase(to_string!(.level))
            }
        kube_filter:
          type: filter
          inputs: ["kube_parse"]
          condition: |
            msg = to_string(.message) ?? ""
            !contains(msg, "kube-probe") && !contains(msg, "Gatus/1.0")
        # Parse each JSON audit event; tag it and set event-time from the audit
        # stageTimestamp so Loki timestamps match when the request happened.
        audit_parse:
          type: remap
          inputs: ["kube_audit"]
          source: |
            parsed, err = parse_json(.message)
            if err == null && is_object(parsed) {
              . = object!(parsed)
            }
            .source = "kube-audit"
            ts, terr = parse_timestamp(.stageTimestamp, "%+")
            if terr == null {
              .timestamp = ts
            }
            .verb = to_string(.verb) ?? ""
            .namespace = to_string(.objectRef.namespace) ?? ""
        # Drop the RequestReceived half of every event (metadata policy logs
        # both stages) plus the noisiest security-irrelevant resources. Finer
        # trimming belongs in the apiserver audit policy (workstream B).
        audit_filter:
          type: filter
          inputs: ["audit_parse"]
          condition: |
            stage = to_string(.stage) ?? ""
            res = to_string(.objectRef.resource) ?? ""
            stage != "RequestReceived" && res != "events" && res != "leases"
        # Flatten a Hubble flow into src/dst endpoint strings (namespace/workload
        # for pods, reserved:<entity> or the IP otherwise) plus L4 port/proto, and
        # a one-line summary so the Grafana logs panel is readable without | json.
        hubble_parse:
          type: remap
          inputs: ["hubble_drops"]
          source: |
            parsed, err = parse_json(.message)
            if err != null || !is_object(parsed) {
              abort
            }
            f = object!(parsed.flow)

            src_ns = to_string(f.source.namespace) ?? ""
            dst_ns = to_string(f.destination.namespace) ?? ""
            src_wl = to_string(f.source.workloads[0].name) ?? to_string(f.source.pod_name) ?? ""
            dst_wl = to_string(f.destination.workloads[0].name) ?? to_string(f.destination.pod_name) ?? ""
            src_res = filter(array(f.source.labels) ?? []) -> |_i, v| { starts_with(to_string(v) ?? "", "reserved:") }
            dst_res = filter(array(f.destination.labels) ?? []) -> |_i, v| { starts_with(to_string(v) ?? "", "reserved:") }
            src_ip = to_string(f.IP.source) ?? ""
            dst_ip = to_string(f.IP.destination) ?? ""

            src = src_ip
            if src_ns != "" {
              src = src_ns + "/" + src_wl
            } else if length(src_res) > 0 {
              src = to_string(src_res[0]) ?? src_ip
            }
            dst = dst_ip
            if dst_ns != "" {
              dst = dst_ns + "/" + dst_wl
            } else if length(dst_res) > 0 {
              dst = to_string(dst_res[0]) ?? dst_ip
            }
            dst_name = to_string(f.destination_names[0]) ?? ""
            if dst_name != "" && dst_ns == "" {
              dst = dst + "(" + dst_name + ")"
            }

            proto = ""
            dport = ""
            if exists(f.l4.TCP) {
              proto = "TCP"
              dport = to_string(f.l4.TCP.destination_port) ?? ""
            } else if exists(f.l4.UDP) {
              proto = "UDP"
              dport = to_string(f.l4.UDP.destination_port) ?? ""
            } else if exists(f.l4.SCTP) {
              proto = "SCTP"
              dport = to_string(f.l4.SCTP.destination_port) ?? ""
            } else if exists(f.l4.ICMPv4) {
              proto = "ICMPv4"
            } else if exists(f.l4.ICMPv6) {
              proto = "ICMPv6"
            }

            direction = downcase(to_string(f.traffic_direction) ?? "unknown")
            reason = to_string(f.drop_reason_desc) ?? "UNKNOWN"
            target = dst
            if dport != "" {
              target = dst + ":" + dport
            }

            ts, terr = parse_timestamp(to_string(f.time) ?? "", "%+")
            if terr != null {
              ts = now()
            }
            node = to_string(f.node_name) ?? to_string(parsed.node_name) ?? ""
            summary = src + " -> " + target + " " + proto + " " + reason + " (" + direction + ")"
            . = {
              "timestamp": ts,
              "message": summary,
              "src": src,
              "src_namespace": src_ns,
              "src_ip": src_ip,
              "dst": dst,
              "dst_namespace": dst_ns,
              "dst_ip": dst_ip,
              "dst_port": dport,
              "protocol": proto,
              "direction": direction,
              "drop_reason": reason,
              "src_names": f.source_names,
              "dst_names": f.destination_names,
              "node": node
            }
            # Keep empty strings: the Loki sink templates src/dst_namespace labels.
            . = compact(., string: false)
      sinks:
        loki:
          type: loki
          dangerously_allow_unconfined_template_resolution: true
          inputs: ["kube_filter"]
          endpoint: http://loki-gateway.o11y.svc.cluster.local
          buffer:
            type: memory
            max_events: 5000
            when_full: drop_newest
          request:
            concurrency: 2
            rate_limit_num: 10
            rate_limit_duration_secs: 1
            retry_max_duration_secs: 30
          batch:
            max_bytes: 524288
            timeout_secs: 5
          encoding:
            codec: json
          labels:
            namespace: '{{ "{{ namespace }}" }}'
            pod: '{{ "{{ pod }}" }}'
            container: '{{ "{{ container }}" }}'
            node: '{{ "{{ node }}" }}'
            source: kubernetes
          out_of_order_action: accept
        loki_audit:
          type: loki
          inputs: ["audit_filter"]
          endpoint: http://loki-gateway.o11y.svc.cluster.local
          buffer:
            type: memory
            max_events: 5000
            when_full: drop_newest
          request:
            concurrency: 2
            rate_limit_num: 10
            rate_limit_duration_secs: 1
            retry_max_duration_secs: 30
          batch:
            max_bytes: 524288
            timeout_secs: 5
          encoding:
            codec: json
          labels:
            service_name: kube-apiserver-audit
            source: kube-audit
            verb: '{{ "{{ verb }}" }}'
          out_of_order_action: accept
        loki_hubble:
          type: loki
          inputs: ["hubble_parse"]
          endpoint: http://loki-gateway.o11y.svc.cluster.local
          buffer:
            type: memory
            max_events: 5000
            when_full: drop_newest
          request:
            concurrency: 2
            rate_limit_num: 10
            rate_limit_duration_secs: 1
            retry_max_duration_secs: 30
          batch:
            max_bytes: 524288
            timeout_secs: 5
          encoding:
            codec: json
          labels:
            service_name: hubble
            source: hubble
            node: '{{ "{{ node }}" }}'
            direction: '{{ "{{ direction }}" }}'
            src_namespace: '{{ "{{ src_namespace }}" }}'
            dst_namespace: '{{ "{{ dst_namespace }}" }}'
          out_of_order_action: accept
        prom_exporter:
          type: prometheus_exporter
          inputs: ["internal_metrics"]
          address: 0.0.0.0:9090

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        # The audit log is 0600 owned by the apiserver uid; DAC_READ_SEARCH lets
        # the root agent read it (drop-ALL otherwise strips root's read-bypass).
        add: ["DAC_READ_SEARCH"]
        drop: ["ALL"]

    resources:
      requests:
        cpu: 25m
        memory: 512Mi
      limits:
        memory: 2Gi

    extraVolumes:
      - name: hubble-flowlogs
        hostPath:
          path: /var/run/cilium/hubble
          type: DirectoryOrCreate
    extraVolumeMounts:
      - name: hubble-flowlogs
        mountPath: /var/run/cilium/hubble
        readOnly: true

    podMonitor:
      enabled: true

    tolerations:
      - effect: NoSchedule
        operator: Exists
