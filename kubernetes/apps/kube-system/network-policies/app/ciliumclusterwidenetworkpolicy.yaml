---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-egress
spec:
  # Cluster-wide egress floor. Every pod outside the excluded namespaces
  # becomes egress default-deny; this policy grants only cluster DNS, so all
  # other egress must be allow-listed by a per-app CiliumNetworkPolicy.
  #
  # Excludes kube-system: it holds DNS, the CNI, CSI, and other infra whose
  # exceptions belong in a purpose-built policy, not a blanket floor.
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  egress:
    # Cluster DNS (L7 so lookups stay visible to Cilium's DNS proxy)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  # Cluster-wide ingress floor. Every pod outside the excluded namespaces
  # becomes ingress default-deny; this policy grants only kubelet probes
  # (which originate from the local node / host), so all other ingress must be
  # allow-listed by a per-app CiliumNetworkPolicy.
  #
  # Exclusions mirror default-deny-egress (see that policy for rationale).
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  ingress:
    # Cluster infrastructure, all trusted node/control-plane identities:
    #   - host: kubelet httpGet/tcpSocket probes from the local node.
    #   - remote-node / kube-apiserver: cross-node kubelet + cilium-health
    #     checks (on this hyper-converged cluster every node hosts the API
    #     server, so peer nodes present as kube-apiserver).
    #   - health: the reserved cilium-health endpoints probe each other.
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
        - health
