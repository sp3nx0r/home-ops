---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Bootstraps cluster-wide Custom Resource Definitions (CRDs) by extracting them
# from upstream Helm charts and applying them directly with kubectl. The releases
# below are never reconciled with helmfile apply or helmfile sync — only their
# CRDs are rendered (via --include-crds) and piped to the cluster.
#
# Installing CRDs out-of-band ensures they exist before Flux begins reconciling
# workloads that reference them, avoiding the need for dependsOn chains on nearly
# every Kustomization that consumes a CRD-backed resource.
#
# cloudflare-dns and envoy-gateway read chart/version from their app dirs via
# the shared template. Prometheus CRDs come from the dedicated (lean)
# prometheus-operator-crds chart rather than templating the full
# kube-prometheus-stack, whose values reference Flux-only substitutions.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

bases:
  - default.yaml

releases:
  - name: cloudflare-dns
    namespace: network
    inherit:
      - template: default

  - name: envoy-gateway
    namespace: network
    inherit:
      - template: default

  - name: prometheus-operator-crds
    namespace: o11y
    chart: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
    # renovate: datasource=docker depName=ghcr.io/prometheus-community/charts/prometheus-operator-crds
    version: 32.0.1
