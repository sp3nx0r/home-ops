---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Bootstraps core applications that provide a minimal runtime base for the
# cluster. These releases are installed first so the cluster has the resources
# Flux needs before its own reconciliation begins.
#
# Chart versions and values are read directly from each app's
# kubernetes/apps/<namespace>/<name>/app/{ocirepository,helmrelease}.yaml, so
# this bootstrap shares the same source of truth as Flux (no version drift).
#
# After this bootstrap phase, Flux takes over management of the full
# application stack and continues reconciling downstream state.

helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

bases:
  - default.yaml

releases:
  - name: cilium
    namespace: kube-system
    inherit:
      - template: default

  - name: coredns
    namespace: kube-system
    inherit:
      - template: default
    needs: ["kube-system/cilium"]

  - name: spegel
    namespace: kube-system
    inherit:
      - template: default
    needs: ["kube-system/coredns"]

  - name: cert-manager
    namespace: cert-manager
    inherit:
      - template: default
    needs: ["kube-system/spegel"]

  - name: flux-operator
    namespace: flux-system
    inherit:
      - template: default
    needs: ["cert-manager/cert-manager"]

  - name: flux-instance
    namespace: flux-system
    inherit:
      - template: default
    needs: ["flux-system/flux-operator"]
