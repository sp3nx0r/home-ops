machine:
  features:
    # Control-plane only: lets the system-upgrade-controller (Tuppr) reach the
    # Talos API with os:admin for node upgrades. Any pod in the system-upgrade
    # namespace inherits this node-root access, so the namespace is default-denied
    # by a CiliumNetworkPolicy (tuppr/app/ciliumnetworkpolicy.yaml).
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - system-upgrade
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.5.0/24
---
# Allow scheduling on control-plane nodes (hyper-converged cluster).
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
# No PodSecurity admission plugin (matches the running cluster).
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$patch: delete
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 127.0.0.1
  - 192.168.5.254
  - cluster.securimancy.com
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: "true"
---
# Trimmed kube-apiserver audit policy. Talos's default is a single
# `level: Metadata` catch-all (audits ~everything -> high volume). Events are
# written to /var/log/audit/kube/*.log and shipped to Loki by Vector
# (o11y/vector, source=kube-audit). Rules are first-match-wins: drop the
# highest-churn noise, keep request bodies off Secrets, elevate auth/policy
# writes to capture what changed.
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  # RequestReceived duplicates every event; never emit it (Vector also filters
  # it, but dropping at the source halves what we write to disk).
  omitStages:
    - RequestReceived
  rules:
    # --- Drop high-volume, low-signal noise (level: None) ---

    # Authn/authz probes fired on ~every request (tokenreviews from
    # system:nodes dominated the observed stream).
    - level: None
      resources:
        - group: authentication.k8s.io
          resources: ["tokenreviews"]
        - group: authorization.k8s.io
          resources:
            - subjectaccessreviews
            - selfsubjectaccessreviews
            - selfsubjectrulesreviews
            - localsubjectaccessreviews

    # Leader-election lease heartbeat churn.
    - level: None
      verbs: ["get", "watch", "update", "patch"]
      resources:
        - group: coordination.k8s.io
          resources: ["leases"]

    # Sensitive resources: metadata ONLY, but ALWAYS audited. Ordered before
    # the broad system-user / system:nodes drops below (first-match-wins) so a
    # kubelet or controller reading Secrets/ConfigMaps still leaves a trail.
    # Never elevate these to Request/RequestResponse (would log secret bodies).
    - level: Metadata
      resources:
        - group: ""
          resources: ["secrets", "configmaps", "serviceaccounts/token"]

    # Control-plane components and kubelets polling their world view.
    - level: None
      users:
        - system:kube-scheduler
        - system:kube-controller-manager
        - system:apiserver
      verbs: ["get", "list", "watch"]
    - level: None
      userGroups: ["system:nodes"]
      verbs: ["get", "list", "watch"]

    # Endpoint / endpointslice / event read+churn.
    - level: None
      verbs: ["get", "list", "watch"]
      resources:
        - group: ""
          resources: ["endpoints", "events"]
        - group: discovery.k8s.io
          resources: ["endpointslices"]

    # Health / discovery / metrics endpoints.
    - level: None
      nonResourceURLs:
        - /healthz*
        - /livez*
        - /readyz*
        - /version
        - /metrics
        - /openapi*
        - /apis*
        - /api*
        - /.well-known*

    # --- Auth / policy / network changes: capture the request body ---
    - level: Request
      verbs: ["create", "update", "patch", "delete", "deletecollection"]
      resources:
        - group: rbac.authorization.k8s.io
          resources:
            - roles
            - rolebindings
            - clusterroles
            - clusterrolebindings
        - group: admissionregistration.k8s.io
          resources:
            - validatingwebhookconfigurations
            - mutatingwebhookconfigurations
        - group: networking.k8s.io
          resources: ["networkpolicies"]
        # Scoped to policy CRDs only; the rest of cilium.io (CiliumEndpoint,
        # CiliumIdentity, CiliumNode, ...) is per-pod/per-IP churn we do not
        # want to capture at Request.
        - group: cilium.io
          resources:
            - ciliumnetworkpolicies
            - ciliumclusterwidenetworkpolicies
        # Certificate issuance/approval — capture who approved what (the
        # decision lives in the request body).
        - group: certificates.k8s.io
          resources:
            - certificatesigningrequests
            - certificatesigningrequests/approval

    # --- Everything else: metadata ---
    - level: Metadata
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
config:
  profiles:
    - schedulerName: default-scheduler
      pluginConfig:
        - name: PodTopologySpread
          args:
            defaultingType: List
            defaultConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
---
# Disable the built-in CNI and kube-proxy; the cluster uses Cilium.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
# Trust Pocket ID (OIDC) tokens forwarded by Headlamp. Native Talos 1.14
# structured authentication; additive to cert / service-account auth.
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  jwt:
    - issuer:
        url: "https://id.securimancy.com"
        audiences:
          - "d08cc81f-49e2-4815-be35-437ff02a8403"
      claimMappings:
        username:
          claim: email
          prefix: "oidc:"
        groups:
          claim: groups
          prefix: "oidc:"
