machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedKubernetesNamespaces:
        - system-upgrade
      allowedRoles:
        - os:admin
  files:
    # Structured AuthenticationConfiguration so kube-apiserver trusts Pocket ID
    # (OIDC) tokens forwarded by Headlamp. Additive: cert/SA-token auth is unchanged.
    # Mutually exclusive with legacy --oidc-* flags (none are set here).
    - op: create
      path: /var/kubernetes/headlamp-oidc-auth-config.yaml
      permissions: 0o644
      content: |
        apiVersion: apiserver.config.k8s.io/v1
        kind: AuthenticationConfiguration
        jwt:
          - issuer:
              url: "https://id.securimancy.com"
              audiences:
                - "d08cc81f-49e2-4815-be35-437ff02a8403"
            claimMappings:
              username:
                claim: email
                prefix: "oidc:"
              groups:
                claim: groups
                prefix: "oidc:"
cluster:
  allowSchedulingOnControlPlanes: true
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service:
        disabled: false
  apiServer:
    admissionControl:
      $$patch: delete
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: Metadata
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
      # Pocket ID OIDC trust (see machine.files above)
      authentication-config: /var/kubernetes/headlamp-oidc-auth-config.yaml
    extraVolumes:
      # kube-apiserver is a static pod; the host file must be mounted in explicitly
      - hostPath: /var/kubernetes/headlamp-oidc-auth-config.yaml
        mountPath: /var/kubernetes/headlamp-oidc-auth-config.yaml
        readonly: true
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.5.0/24
  proxy:
    disabled: true
  scheduler:
    # TODO: Re-enable after Talos fixes DeepCopyJSONValue panic with integer fields
    # in scheduler config. Tracked in https://github.com/siderolabs/talos/issues/13473
    # config:
    #   apiVersion: kubescheduler.config.k8s.io/v1
    #   kind: KubeSchedulerConfiguration
    #   profiles:
    #     - schedulerName: default-scheduler
    #       pluginConfig:
    #         - name: PodTopologySpread
    #           args:
    #             defaultingType: List
    #             defaultConstraints:
    #               - maxSkew: 1
    #                 topologyKey: kubernetes.io/hostname
    #                 whenUnsatisfiable: ScheduleAnyway
    extraArgs:
      bind-address: 0.0.0.0
