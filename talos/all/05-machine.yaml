machine:
  # Talos-API RBAC and XFS project quotas stay as v1alpha1 machine features
  # (.machine.features has no typed replacement document in Talos 1.14).
  features:
    rbac: true
    diskQuotaSupport: true
  # System-disk encryption lives in VolumeConfig documents (see
  # all/60-encryption.yaml) and NFS mount defaults in an EtcFileConfig document
  # (see all/51-etc-files.yaml); both .machine.systemDiskEncryption and
  # .machine.files are deprecated in Talos 1.14.
