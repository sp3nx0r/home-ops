machine:
  # Talos-API RBAC and XFS project quotas stay as v1alpha1 machine features
  # (no dedicated typed document in Talos 1.14, no conflict).
  features:
    rbac: true
    diskQuotaSupport: true
  # System-disk encryption lives in VolumeConfig documents (see
  # all/60-encryption.yaml) so we can set allowDiscards, which is only
  # available in the Talos 1.14 multi-doc format.
  files:
    - op: overwrite
      path: /etc/nfsmount.conf
      permissions: 0o644
      content: |
        [ NFSMount_Global_Options ]
        nfsvers=4.2
        hard=True
        nconnect=16
        noatime=True
        rsize=1048576
        wsize=1048576
