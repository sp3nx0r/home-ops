# Talos host ingress firewall (nftables `input` + `prerouting` on the node's own
# addresses). Default-block; only the rules below plus Talos's built-in
# exceptions (lo, established/related, rate-limited ICMP, pod/service-CIDR <->
# pod/service-CIDR, pod -> host DNS) are accepted. Control-plane-only services
# live in control-plane/80-firewall.yaml. Plan, port matrix and rollout:
# docs/completed/talos-host-firewall-plan.md.
#
# Traffic Cilium handles in eBPF at tc ingress (LoadBalancer IPs, NodePorts,
# hostPorts) is translated to a pod IP before netfilter sees it, so it neither
# needs rules here nor is filtered by them. Pod -> node traffic is NOT
# masqueraded (native routing), so in-cluster clients such as Prometheus arrive
# from 10.42.0.0/16. The node /32s must be extended when a node is added.
# A mistake can lock out apid. Roll out with `talosctl apply-config --mode try
# --timeout 10m` per the plan doc, not `just talos apply-node <node> try` (1m).
---
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
# apid: LAN admin hosts and other nodes (apid proxies between members), plus
# pods using kubernetesTalosAPIAccess (tuppr, via the default/talos Service).
# The LAN-wide source relies on apid's mTLS; it avoids pinning a workstation IP.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apid-ingress
portSelector:
  ports:
    - 50000
  protocol: tcp
ingress:
  - subnet: 192.168.5.0/24
  - subnet: 10.42.0.0/16
---
# kubelet: kube-apiserver (from node IPs), Prometheus and metrics-server (pods).
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubelet-ingress
portSelector:
  ports:
    - 10250
  protocol: tcp
ingress:
  - subnet: 192.168.5.50/32
  - subnet: 192.168.5.51/32
  - subnet: 192.168.5.52/32
  - subnet: 10.42.0.0/16
---
# cilium-health (node-to-node) and the Hubble peer API (hubble-relay pods).
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: cilium-ingress
portSelector:
  ports:
    - 4240
    - 4244
  protocol: tcp
ingress:
  - subnet: 192.168.5.50/32
  - subnet: 192.168.5.51/32
  - subnet: 192.168.5.52/32
  - subnet: 10.42.0.0/16
---
# Prometheus scrapes: node-exporter, cilium agent/operator/envoy/hubble metrics.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: node-metrics-ingress
portSelector:
  ports:
    - 9100
    - 9962-9965
  protocol: tcp
ingress:
  - subnet: 10.42.0.0/16
